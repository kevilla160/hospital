<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Triagem</title>

<link rel="stylesheet" href="style.css">

<style>

  .btn-tv {
    background: #28a745;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 8px;
  }

  .btn-tv:hover {
    background: #1e7e34;
  }


  .pacientes-fila {
    margin-bottom: 30px;
    background: #f0f4ff;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid #d0d8f0;
  }


  .pacientes-fila h3 {
    margin-top: 0;
    color: #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }


  .pacientes-fila h3 span {
    font-size: 13px;
    font-weight: normal;
    color: #666;
  }


  .fila-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #dce4ff;
    gap: 10px;
    flex-wrap: wrap;
  }


  .fila-item strong {
    font-size: 15px;
  }


  .fila-item small {
    color: #888;
    font-size: 12px;
  }


  .btn-abrir-tv {
    display: inline-block;
    background: #17a2b8;
    color: white;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }


  .btn-abrir-tv:hover {
    background: #117a8b;
  }


  .btn-atualizar {
    margin-top: 8px;
    background: #6c757d;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }


  .btn-atualizar:hover {
    background: #545b62;
  }


  #resultado {
    margin: 15px 0;
    padding: 12px;
    border-radius: 6px;
    font-weight: bold;
    text-align: center;
    display: none;
  }


  #resultado.verde {
    display: block;
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }


  #resultado.amarelo {
    display: block;
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffeeba;
  }


  #resultado.vermelho {
    display: block;
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }


  #resultado.erro {
    display: block;
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }


  .btn-salvar {
    background: #007bff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
  }


  .btn-salvar:hover {
    background: #0056b3;
  }


  .btn-salvar:disabled {
    background: #999;
    cursor: not-allowed;
  }

</style>

</head>


<body>


<div class="container">


  <!-- ==============================
       CABEÇALHO
       ============================== -->

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:10px;
    flex-wrap:wrap;
  ">

    <h2 style="margin:0;">
      🏥 Triagem Hospitalar
    </h2>


    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')">

      📺 Abrir Tela da TV

    </button>

  </div>


  <!-- ==============================
       FILA DE PACIENTES
       ============================== -->

  <div class="pacientes-fila">

    <h3>

      Pacientes Cadastrados no Atendimento

      <span>
        Clique em "Chamar na TV" para chamar ao guichê
      </span>

    </h3>


    <div id="fila-pacientes">

      <p style="
        color:#888;
        text-align:center;
      ">

        Carregando...

      </p>

    </div>


    <button
      class="btn-atualizar"
      onclick="carregarPacientes()">

      🔄 Atualizar lista

    </button>

  </div>


  <hr>


  <!-- ==============================
       FORMULÁRIO DE TRIAGEM
       ============================== -->

  <h3>
    Formulário de Triagem
  </h3>


  <input
    id="nome"
    type="text"
    placeholder="Nome do paciente">


  <select id="sintoma">

    <option value="">
      Selecione o sintoma
    </option>

    <option value="dor_leve">
      Dor leve
    </option>

    <option value="resfriado">
      Resfriado
    </option>

    <option value="coriza">
      Coriza
    </option>

    <option value="tosse">
      Tosse
    </option>

    <option value="febre">
      Febre
    </option>

    <option value="vomito">
      Vômito
    </option>

    <option value="diarreia">
      Diarreia
    </option>

    <option value="falta_ar_moderada">
      Falta de ar moderada
    </option>

    <option value="falta_ar_grave">
      Falta de ar grave
    </option>

    <option value="infarto">
      Suspeita de infarto
    </option>

    <option value="avc">
      Suspeita de AVC
    </option>

    <option value="convulsao">
      Convulsão
    </option>

    <option value="hemorragia">
      Hemorragia
    </option>

  </select>


  <input
    id="temp"
    type="number"
    step="0.1"
    placeholder="Temperatura">


  <input
    id="alergia"
    type="text"
    placeholder="Alergias">


  <textarea
    id="observacao"
    placeholder="Observações">
  </textarea>


  <!-- RESULTADO DA CLASSIFICAÇÃO -->

  <div id="resultado"></div>


  <!-- BOTÃO SALVAR -->

  <button
    id="btn-salvar"
    class="btn-salvar"
    onclick="salvar()">

    💾 Salvar Triagem

  </button>


</div>



<script>


/* =====================================================
   CARREGAR PACIENTES
   ===================================================== */

function carregarPacientes() {

  fetch("/pacientes")

    .then(async response => {

      if (!response.ok) {

        const texto =
          await response.text();

        throw new Error(
          texto ||
          "Erro ao carregar pacientes."
        );

      }

      return response.json();

    })

    .then(pacientes => {

      const div =
        document.getElementById(
          "fila-pacientes"
        );


      /* Verifica se realmente recebeu uma lista */

      if (!Array.isArray(pacientes)) {

        throw new Error(
          "O servidor não retornou uma lista de pacientes."
        );

      }


      /* Mostra apenas pacientes em triagem */

      const fila =
        pacientes.filter(
          p => p.status === "triagem"
        );


      if (fila.length === 0) {

        div.innerHTML =
          "<p style='color:#888; text-align:center;'>" +
          "Nenhum paciente aguardando." +
          "</p>";

        return;

      }


      div.innerHTML = "";


      fila.forEach(p => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "fila-item";


        /*
         * Criamos os elementos dessa forma
         * para evitar problemas caso o nome
         * contenha aspas ou caracteres especiais.
         */

        const informacoes =
          document.createElement(
            "div"
          );


        const nome =
          document.createElement(
            "strong"
          );


        nome.textContent =
          p.nome || "Paciente";


        const br =
          document.createElement(
            "br"
          );


        const detalhes =
          document.createElement(
            "small"
          );


        detalhes.textContent =
          "CPF: " +
          (p.cpf || "—") +
          " | Tipo: " +
          (p.tipo || "—");


        informacoes.appendChild(
          nome
        );

        informacoes.appendChild(
          br
        );

        informacoes.appendChild(
          detalhes
        );


        const botao =
          document.createElement(
            "button"
          );


        botao.className =
          "btn-tv";


        botao.textContent =
          "📺 Chamar na TV";


        botao.onclick =
          function() {

            chamarNaTV(
              p.nome
            );

          };


        item.appendChild(
          informacoes
        );


        item.appendChild(
          botao
        );


        div.appendChild(
          item
        );

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar pacientes:",
        error
      );


      document.getElementById(
        "fila-pacientes"
      ).innerHTML =

        "<p style='color:red;'>" +
        "❌ Erro ao carregar pacientes.<br>" +
        error.message +
        "</p>";

    });

}



/* =====================================================
   CHAMAR NA TV
   ===================================================== */

function chamarNaTV(nome) {

  fetch("/tv/chamar", {

    method: "POST",

    headers: {

      "Content-Type":
        "application/json"

    },

    body: JSON.stringify({

      localTipo:
        "GUICHÊ",

      localNumero:
        "01",

      paciente:
        nome

    })

  })

  .then(async response => {

    if (!response.ok) {

      const texto =
        await response.text();

      throw new Error(
        texto ||
        "Erro ao chamar paciente."
      );

    }

    return response.json();

  })

  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Guichê 01!"
    );

  })

  .catch(error => {

    console.error(
      "Erro ao chamar na TV:",
      error
    );


    alert(
      "❌ Erro ao chamar paciente na TV.\n\n" +
      error.message
    );

  });

}



/* =====================================================
   CLASSIFICAR RISCO
   ===================================================== */

function classificarRisco(
  sintoma,
  temperatura
) {

  const vermelhos = [

    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave"

  ];


  const amarelos = [

    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"

  ];


  if (
    !isNaN(temperatura) &&
    temperatura >= 39
  ) {

    return "vermelho";

  }


  if (
    vermelhos.includes(
      sintoma
    )
  ) {

    return "vermelho";

  }


  if (
    amarelos.includes(
      sintoma
    )
  ) {

    return "amarelo";

  }


  return "verde";

}



/* =====================================================
   LIMPAR FORMULÁRIO
   ===================================================== */

function limparFormulario() {

  document.getElementById(
    "nome"
  ).value = "";


  document.getElementById(
    "sintoma"
  ).value = "";


  document.getElementById(
    "temp"
  ).value = "";


  document.getElementById(
    "alergia"
  ).value = "";


  document.getElementById(
    "observacao"
  ).value = "";


  document.getElementById(
    "resultado"
  ).style.display =
    "none";

}



/* =====================================================
   SALVAR TRIAGEM
   ===================================================== */

async function salvar() {

  const btn =
    document.getElementById(
      "btn-salvar"
    );


  const nome =
    document.getElementById(
      "nome"
    ).value.trim();


  const sintoma =
    document.getElementById(
      "sintoma"
    ).value;


  const tempTexto =
    document.getElementById(
      "temp"
    ).value;


  const alergia =
    document.getElementById(
      "alergia"
    ).value.trim();


  const observacao =
    document.getElementById(
      "observacao"
    ).value.trim();


  /* ==============================
     VALIDAÇÕES
     ============================== */

  if (!nome) {

    alert(
      "⚠️ Digite o nome do paciente."
    );

    document.getElementById(
      "nome"
    ).focus();

    return;

  }


  if (!sintoma) {

    alert(
      "⚠️ Selecione o sintoma."
    );

    document.getElementById(
      "sintoma"
    ).focus();

    return;

  }


  let temperatura = null;


  if (tempTexto !== "") {

    temperatura =
      Number(
        tempTexto
      );


    if (
      Number.isNaN(
        temperatura
      )
    ) {

      alert(
        "⚠️ Informe uma temperatura válida."
      );

      return;

    }

  }


  /* Classificação */

  const risco =
    classificarRisco(
      sintoma,
      temperatura
    );


  /* Mostra classificação */

  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.className =
    risco;


  resultado.style.display =
    "block";


  resultado.innerHTML =
    "Classificação: " +
    risco.toUpperCase();


  /* ==============================
     DESABILITA BOTÃO
     ============================== */

  btn.disabled =
    true;


  btn.textContent =
    "⏳ Salvando...";


  try {

    /* ==============================
       ENVIA PARA O SERVIDOR
       ============================== */

    const response =
      await fetch(
        "/triagem",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              nome:
                nome,

              sintoma:
                sintoma,

              temperatura:
                temperatura,

              alergia:
                alergia,

              observacao:
                observacao,

              risco:
                risco

            })

        }
      );


    /*
     * Primeiro pegamos a resposta
     * como texto para conseguir mostrar
     * o erro real do servidor.
     */

    const texto =
      await response.text();


    let data = null;


    try {

      data =
        texto
          ? JSON.parse(texto)
          : null;

    } catch {

      data =
        texto;

    }


    /* ==============================
       VERIFICA SE DEU ERRO
       ============================== */

    if (!response.ok) {

      console.error(
        "Erro retornado pelo servidor:",
        data
      );


      throw new Error(
        typeof data === "string"
          ? data
          : (
              data?.erro ||
              data?.error ||
              data?.message ||
              "Erro ao salvar triagem."
            )
      );

    }


    /* ==============================
       SUCESSO
       ============================== */

    console.log(
      "Triagem salva:",
      data
    );


    alert(
      "✅ Triagem salva com sucesso!\n\n" +
      "Paciente: " +
      nome +
      "\n" +
      "Classificação: " +
      risco.toUpperCase()
    );


    /* Limpa formulário */

    limparFormulario();


    /* Atualiza lista */

    carregarPacientes();


  } catch (error) {

    console.error(
      "Erro ao salvar triagem:",
      error
    );


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "erro";


    resultado.style.display =
      "block";


    resultado.innerHTML =
      "❌ Erro ao salvar: " +
      error.message;


    alert(
      "❌ Não foi possível salvar a triagem.\n\n" +
      error.message
    );


  } finally {

    /* Reativa botão */

    btn.disabled =
      false;


    btn.textContent =
      "💾 Salvar Triagem";

  }

}



/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

carregarPacientes();


/* Atualiza a lista a cada 10 segundos */

setInterval(
  carregarPacientes,
  10000
);

</script>


</body>

</html>
