<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Médico</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="container">

  <h2>🩺 Painel Médico</h2>

  <!-- CONSULTÓRIO -->
  <label>Consultório:</label>
  <input id="consultorio" value="01" maxlength="3">

  <button onclick="window.open('tv.html','_blank')">
    📺 Abrir TV
  </button>

  <hr>

  <!-- FILA -->
  <h3>Fila de Pacientes</h3>
  <div id="triagens"></div>

  <hr>

  <!-- CONSULTA -->
  <h3>Consulta</h3>

  <input id="paciente" placeholder="Paciente">

  <input id="diagnostico" placeholder="Diagnóstico">

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea id="obs" placeholder="Observações"></textarea>

  <br>

  <button onclick="salvar()">
    💾 Salvar Consulta
  </button>

  <button onclick="gerarPDF()">
    📄 Gerar PDF
  </button>

</div>

<script>

let triagens = [];

/* CARREGAR FILA */
function carregar() {

  fetch("/triagens")
    .then(r => r.json())
    .then(data => {

      triagens = data;

      const div = document.getElementById("triagens");
      div.innerHTML = "";

      if (!data.length) {
        div.innerHTML = "<p>Nenhum paciente na fila.</p>";
        return;
      }

      data.forEach((p, i) => {

        div.innerHTML += `
          <div class="card">

            <h3>${p.nome}</h3>

            <p>
              <b>Sintoma:</b>
              ${p.sintoma || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${p.temperatura || "Não informada"}°C
            </p>

            <p>
              <b>Risco:</b>
              ${p.risco || "Não informado"}
            </p>

            <button onclick="atender(${i})">
              Atender
            </button>

            <button onclick="chamarTV(${i})">
              📺 Chamar
            </button>

          </div>
        `;

      });

    })
    .catch(() => {
      console.log("Erro ao carregar fila.");
    });
}


/* ATENDER */
function atender(i) {

  const p = triagens[i];

  document.getElementById("paciente").value = p.nome;
  document.getElementById("obs").value = p.observacao || "";

  if (p.alergia && p.alergia !== "Nenhuma") {
    alert("⚠️ Alergia: " + p.alergia);
  }
}


/* CHAMAR NA TV */
function chamarTV(i) {

  const p = triagens[i];

  const consultorio =
    document.getElementById("consultorio").value || "01";

  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      localTipo: "CONSULTÓRIO",
      localNumero: consultorio,
      paciente: p.nome
    })

  })
  .then(() => {
    alert("Paciente chamado na TV.");
  })
  .catch(() => {
    alert("Erro ao chamar paciente.");
  });
}


/* CARREGAR MEDICAÇÕES */
function carregarMedicacoes() {

  fetch("/lista-medicacoes")
    .then(r => r.json())
    .then(data => {

      const select =
        document.getElementById("medicacao");

      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;
        option.textContent = med;

        select.appendChild(option);

      });

    });
}


/* SALVAR CONSULTA */
function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;

  if (!paciente) {
    alert("Selecione um paciente.");
    return;
  }

  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      paciente,
      diagnostico,
      medicacao,
      obs
    })

  })
  .then(() => {
    alert("✅ Consulta salva.");
  })
  .catch(() => {
    alert("❌ Erro ao salvar.");
  });
}


/* GERAR PDF */
function gerarPDF() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;

  if (!paciente) {
    alert("Selecione um paciente.");
    return;
  }

  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF();

  let y = 20;

  pdf.setFontSize(18);
  pdf.text("PAINEL MÉDICO", 105, y, {
    align: "center"
  });

  y += 15;

  pdf.setFontSize(12);

  pdf.text("Paciente: " + paciente, 20, y);
  y += 10;

  pdf.text("Diagnóstico: " + (diagnostico || "Não informado"), 20, y);
  y += 10;

  pdf.text("Medicação: " + (medicacao || "Não informado"), 20, y);
  y += 10;

  pdf.text("Observações:", 20, y);
  y += 7;

  const linhas =
    pdf.splitTextToSize(
      obs || "Nenhuma",
      170
    );

  pdf.text(linhas, 20, y);

  y += linhas.length * 6 + 15;

  pdf.text(
    "Data: " +
    new Date().toLocaleDateString("pt-BR"),
    20,
    y
  );

  pdf.save(
    "Consulta_" +
    paciente.replace(/\s+/g, "_") +
    ".pdf"
  );
}


/* INICIAR */
carregar();
carregarMedicacoes();

/* ATUALIZAR FILA */
setInterval(carregar, 10000);

</script>

</body>
</html>
