<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="/css/atendimento.css"></head>
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="data" placeholder="data">
<input id="sexo" placeholder="sexo">
<input id="nome da mae" placeholder="nome da mae">
<input id="estado civil" placeholder="estado civil">
<input id="endereo" placeholder="endereco">
<input id="telefone" placeholder="telefone">
<input id="e-mail" placeholder="e-mail">
<input id="contato de emergencia" placeholder="contato de emergencia">
  

<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>



<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    nome: nome.value,
    cpf: cpf.value,
    tipo: tipo.value,
    data: data.value,
    responsavel: responsavel.value,
    estadocivil: estadocivil.value,
    endereco: endereco.value,
    telefone: telefone.value,
    email: email.value,
    emergencia: emergencia.value
  })
 });
 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>
